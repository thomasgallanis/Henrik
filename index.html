<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ALPHA AI — Finnish and English fictional story concept with a demo calculator." />
    <meta name="theme-color" content="#f6f4ee" />
    <title>ALPHA AI — Markkinatiedustelun konsepti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
      :root {
        --bg:#f6f4ee; --surface:#fffefa; --surface-2:#eeeae0; --ink:#20221f;
        --muted:#61635b; --line:rgba(45,47,41,.18); --gold:#c8ad70; --gold-dark:#806835;
        --shadow:0 24px 70px rgba(40,36,25,.10);
      }
      [data-theme="night"] {
        --bg:#111315; --surface:#191b1c; --surface-2:#202223; --ink:#e9e6df;
        --muted:#aaa9a3; --line:rgba(220,204,157,.18); --gold:#d2ba7e; --gold-dark:#e0cf9f;
        --shadow:0 24px 70px rgba(0,0,0,.28);
      }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; scroll-padding-top:90px; }
      body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; transition:background .2s,color .2s; }
      a { color:inherit; }
      .container { max-width:1180px; }
      .top-note { padding:.58rem 1rem; background:#eee8d8; color:#55472b; text-align:center; font-size:.72rem; letter-spacing:.04em; }
      [data-theme="night"] .top-note { background:#302a1e; color:#e4d5ab; }
      .site-nav { background:color-mix(in srgb,var(--bg) 93%,transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
      .navbar-brand { color:var(--ink); font-weight:800; letter-spacing:.12em; }
      .brand-mark { display:inline-grid; place-items:center; width:30px; height:30px; margin-right:.65rem; border:1px solid var(--gold-dark); color:var(--gold-dark); transform:rotate(45deg); }
      .brand-mark span { transform:rotate(-45deg); }
      .nav-link { color:var(--muted); font-size:.84rem; }
      .nav-link:hover { color:var(--gold-dark); }
      .header-tools { display:flex; align-items:center; gap:.5rem; }
      .lang-switch { display:flex; gap:2px; border:1px solid var(--line); border-radius:30px; padding:3px; }
      .lang-switch button,.theme-button { border:0; border-radius:30px; background:transparent; color:var(--ink); padding:.35rem .6rem; font-size:.75rem; }
      .lang-switch button.active { background:var(--gold); color:#171715; font-weight:700; }
      .theme-button { border:1px solid var(--line); min-width:36px; min-height:36px; }
      .btn-gold { background:var(--gold); border-color:var(--gold); color:#171715; font-weight:700; }
      .btn-gold:hover { background:#dfca91; border-color:#dfca91; color:#171715; }
      .btn-outline-gold { border:1px solid var(--gold-dark); color:var(--gold-dark); }
      .btn-outline-gold:hover { background:var(--gold); color:#171715; }
      .hero { padding:5rem 0; background:radial-gradient(ellipse at 78% 20%,rgba(142,120,70,.12),transparent 44%),linear-gradient(145deg,var(--bg),var(--surface-2)); }
      .hero-title { max-width:680px; font:500 clamp(2.8rem,6.7vw,5.5rem)/.99 Georgia,serif; letter-spacing:-.06em; }
      .gold-text { color:var(--gold-dark); }
      .eyebrow { color:var(--gold-dark); text-transform:uppercase; letter-spacing:.14em; font-size:.7rem; font-weight:700; }
      .hero-copy,.section-copy { max-width:620px; color:var(--muted); line-height:1.8; }
      .hero-stats { display:flex; gap:2rem; margin-top:2rem; padding-top:1.3rem; border-top:1px solid var(--line); }
      .hero-stats strong { display:block; color:var(--gold-dark); font:500 1.6rem Georgia,serif; }
      .hero-stats span { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
      .hero-note { margin-top:1.5rem; color:var(--muted); font-size:.68rem; letter-spacing:.07em; }
      .registration-card,.surface,.metric-card,.faq-card { background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
      .registration-card { padding:clamp(1.3rem,3vw,2rem); }
      .registration-card h2 { font:500 clamp(1.7rem,3vw,2.2rem) Georgia,serif; letter-spacing:-.04em; }
      .tiny-note { color:var(--muted); font-size:.77rem; line-height:1.65; }
      .form-label { color:var(--muted); font-size:.75rem; font-weight:650; }
      .form-control,.form-select { background:var(--bg); color:var(--ink); border-color:var(--line); }
      .form-control:focus,.form-select:focus { background:var(--surface); color:var(--ink); border-color:var(--gold-dark); box-shadow:0 0 0 .2rem rgba(200,173,112,.18); }
      .phone-row { display:grid; grid-template-columns: minmax(112px,.74fr) minmax(0,1.26fr); gap:.65rem; }
      .hint { color:var(--muted); font-size:.69rem; }
      .status { color:var(--gold-dark); font-size:.8rem; }
      .proof-strip { padding:1.3rem 0; background:var(--surface-2); border-block:1px solid var(--line); }
      .proof-item { display:flex; gap:.65rem; align-items:center; color:var(--muted); font-size:.78rem; }
      .proof-mark { color:var(--gold-dark); font-size:1.1rem; }
      .section { padding:5.5rem 0; }
      .section-title { max-width:800px; margin:1rem 0; font:500 clamp(2.25rem,5vw,4rem)/1.05 Georgia,serif; letter-spacing:-.05em; }
      .steps { display:grid; grid-template-columns:repeat(5,1fr); gap:1.25rem; margin-top:3rem; border-top:1px solid var(--line); }
      .step { padding-top:1.3rem; }
      .step-number { color:var(--gold-dark); font-size:.75rem; }
      .step h3,.info-card h3 { margin:1rem 0 .5rem; font:500 1.2rem Georgia,serif; }
      .step p,.info-card p { color:var(--muted); font-size:.82rem; line-height:1.7; }
      .system-section { background:var(--surface-2); }
      .surface { padding:clamp(1.4rem,3vw,2.3rem); box-shadow:none; }
      .flow { display:grid; gap:.6rem; }
      .flow-item { display:flex; gap:1rem; align-items:center; min-height:42px; border-bottom:1px solid var(--line); font-size:.86rem; }
      .flow-item span { color:var(--gold-dark); font-size:.7rem; }
      .tag-list { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:1rem; }
      .tag-list span { border:1px solid var(--line); padding:.35rem .55rem; color:var(--muted); font-size:.68rem; }
      .metric-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.8rem; margin:2rem 0 3rem; }
      .metric-card { padding:1.25rem; box-shadow:none; }
      .metric-card strong { display:block; color:var(--gold-dark); font:500 1.5rem Georgia,serif; }
      .metric-card span { display:block; margin-top:.55rem; font-size:.84rem; font-weight:650; }
      .metric-card small { display:block; margin-top:.3rem; color:var(--muted); font-size:.73rem; }
      .calculator { background:var(--surface); border:1px solid var(--line); }
      .calculator-side { padding:clamp(1.2rem,3vw,2rem); }
      .calculator-results { border-left:1px solid var(--line); }
      .range-line { display:flex; justify-content:space-between; margin:1rem 0 .35rem; color:var(--muted); font-size:.78rem; }
      .form-range { accent-color:var(--gold-dark); }
      .preset-row { display:flex; flex-wrap:wrap; gap:.35rem; }
      .preset { padding:.35rem .5rem; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:.7rem; }
      .preset.active { background:var(--gold); color:#171715; }
      .mode-row { display:flex; gap:.5rem; margin-top:1rem; }
      .mode-row button { flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); padding:.55rem; font-size:.76rem; }
      .mode-row button.active { background:var(--gold); color:#171715; }
      .period-card { height:100%; padding:1rem; background:var(--surface-2); }
      .period-card span { color:var(--muted); font-size:.72rem; }
      .period-card strong { display:block; margin:.45rem 0; font:500 clamp(1rem,2vw,1.35rem) Georgia,serif; }
      .period-card small { color:var(--gold-dark); }
      .quote-box { padding:2rem; background:var(--surface-2); border-left:2px solid var(--gold); }
      .quote-box blockquote { margin:1.4rem 0; font:500 clamp(1.5rem,3.2vw,2.5rem)/1.25 Georgia,serif; }
      .faq-card { padding:1rem 1.25rem; box-shadow:none; }
      .accordion-item,.accordion-button,.accordion-body { background:var(--surface); color:var(--ink); border-color:var(--line); }
      .accordion-button:not(.collapsed) { color:var(--ink); background:var(--surface-2); box-shadow:none; }
      .accordion-body { color:var(--muted); font-size:.84rem; line-height:1.7; }
      .disclosure { padding:1.2rem 0; border-top:1px solid var(--line); color:var(--muted); font-size:.72rem; line-height:1.7; }
      footer { padding:2.5rem 0 1.5rem; background:var(--surface-2); border-top:1px solid var(--line); color:var(--muted); font-size:.75rem; }
      .footer-links { display:flex; flex-wrap:wrap; gap:1rem; }
      .footer-links a { text-decoration:none; }
      @media(max-width:991.98px) {
        .navbar-collapse { padding:.6rem 0; }
        .steps { grid-template-columns:repeat(2,1fr); }
        .calculator-results { border-left:0; border-top:1px solid var(--line); }
      }
      @media(max-width:575.98px) {
        .hero { padding:3.3rem 0; }
        .phone-row { grid-template-columns:minmax(104px,.78fr) minmax(0,1.22fr); gap:.45rem; }
        .steps,.metric-grid { grid-template-columns:1fr 1fr; }
        .section { padding:4rem 0; }
      }
      @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body data-theme="day">
    <div class="top-note" data-copy="banner"></div>
    <nav class="navbar navbar-expand-lg sticky-top site-nav" aria-label="Päänavigaatio">
      <div class="container py-2">
        <a class="navbar-brand d-flex align-items-center" href="#top" aria-label="Alpha AI">
          <span class="brand-mark"><span>A</span></span> ALPHA AI
        </a>
        <div class="header-tools order-lg-3 ms-auto ms-lg-3">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="active" data-language="fi" aria-pressed="true">FI</button>
            <button type="button" data-language="en" aria-pressed="false">EN</button>
          </div>
          <button class="theme-button" id="themeToggle" type="button" aria-label="Vaihda yötilaan" title="Vaihda yötilaan">☾</button>
        </div>
        <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Avaa valikko">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse order-lg-2" id="mainNavigation">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="#how-it-works" data-copy="navHow"></a></li>
            <li class="nav-item"><a class="nav-link" href="#system" data-copy="navSystem"></a></li>
            <li class="nav-item"><a class="nav-link" href="#performance" data-copy="navCalc"></a></li>
            <li class="nav-item"><a class="nav-link" href="#about" data-copy="navAbout"></a></li>
            <li class="nav-item"><a class="nav-link" href="#faq" data-copy="navFaq"></a></li>
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0"><a class="btn btn-gold btn-sm" href="#registration" data-copy="getStarted"></a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="top">
      <section class="hero">
        <div class="container">
          <div class="row align-items-center g-5">
            <div class="col-lg-6">
              <div class="eyebrow mb-3" data-copy="heroEyebrow"></div>
              <h1 class="hero-title mb-4"><span data-copy="heroTitle"></span> <span class="gold-text" data-copy="heroAccent"></span></h1>
              <p class="hero-copy mb-4" data-copy="heroCopy"></p>
              <div class="d-flex flex-wrap gap-3">
                <a class="btn btn-gold" href="#registration" data-copy="heroButton"></a>
                <a class="btn btn-outline-gold" href="#how-it-works" data-copy="heroSecondary"></a>
              </div>
              <div class="hero-stats">
                <div><strong>FI / EN</strong><span data-copy="statLanguage"></span></div>
                <div><strong data-copy="statTheme"></strong><span data-copy="statThemeLabel"></span></div>
              </div>
              <div class="hero-note" data-copy="heroNote"></div>
            </div>
            <div class="col-lg-5 offset-lg-1" id="registration">
              <form class="registration-card" id="registrationForm" novalidate>
                <div class="eyebrow mb-2" data-copy="formEyebrow"></div>
                <h2 class="mb-2" data-copy="formTitle"></h2>
                <p class="tiny-note mb-4" data-copy="formIntro"></p>
                <div class="mb-3">
                  <label class="form-label" for="fullName" data-copy="fullName"></label>
                  <input class="form-control" id="fullName" name="fullName" autocomplete="off" placeholder="Alex Morgan" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="emailAddress" data-copy="email"></label>
                  <input class="form-control" id="emailAddress" name="email" type="email" autocomplete="off" placeholder="alex@example.com" required />
                </div>
                <div class="phone-row mb-2">
                  <div>
                    <label class="form-label" for="countryCode" data-copy="countryCode"></label>
                    <select class="form-select" id="countryCode" aria-label="Phone country code">
                      <option value="+358">FI +358</option><option value="+44">GB +44</option><option value="+1">US +1</option>
                      <option value="+49">DE +49</option><option value="+33">FR +33</option><option value="+46">SE +46</option>
                      <option value="+47">NO +47</option><option value="+45">DK +45</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label" for="phoneNumber" data-copy="phone"></label>
                    <input class="form-control" id="phoneNumber" name="phone" type="tel" autocomplete="off" placeholder="20 0000 0000" required />
                  </div>
                </div>
                <p class="hint mb-3" data-copy="ipHint"></p>
                <button class="btn btn-gold w-100" type="submit" data-copy="formButton"></button>
                <p class="tiny-note mt-3 mb-0" data-copy="formPrivacy"></p>
                <p class="tiny-note mt-2 mb-0" data-copy="formAdvisor"></p>
                <div class="status mt-3" id="formStatus" role="status" aria-live="polite"></div>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section class="proof-strip">
        <div class="container"><div class="row g-3">
          <div class="col-6 col-lg-3 proof-item"><span class="proof-mark">◎</span><span data-copy="proof1"></span></div>
          <div class="col-6 col-lg-3 proof-item"><span class="proof-mark">⌁</span><span data-copy="proof2"></span></div>
          <div class="col-6 col-lg-3 proof-item"><span class="proof-mark">↗</span><span data-copy="proof3"></span></div>
          <div class="col-6 col-lg-3 proof-item"><span class="proof-mark">◉</span><span data-copy="proof4"></span></div>
        </div></div>
      </section>

      <section class="section" id="how-it-works">
        <div class="container">
          <div class="eyebrow" data-copy="howEyebrow"></div>
          <h2 class="section-title"><span data-copy="howTitle"></span> <span class="gold-text" data-copy="howAccent"></span></h2>
          <p class="section-copy" data-copy="howIntro"></p>
          <div class="steps">
            <article class="step"><div class="step-number">01</div><h3 data-copy="step1Title"></h3><p data-copy="step1Text"></p></article>
            <article class="step"><div class="step-number">02</div><h3 data-copy="step2Title"></h3><p data-copy="step2Text"></p></article>
            <article class="step"><div class="step-number">03</div><h3 data-copy="step3Title"></h3><p data-copy="step3Text"></p></article>
            <article class="step"><div class="step-number">04</div><h3 data-copy="step4Title"></h3><p data-copy="step4Text"></p></article>
            <article class="step"><div class="step-number">05</div><h3 data-copy="step5Title"></h3><p data-copy="step5Text"></p></article>
          </div>
        </div>
      </section>

      <section class="section system-section" id="system">
        <div class="container">
          <div class="row align-items-center g-5">
            <div class="col-lg-6">
              <div class="eyebrow mb-3" data-copy="systemEyebrow"></div>
              <h2 class="section-title mt-0"><span data-copy="systemTitle"></span> <span class="gold-text" data-copy="systemAccent"></span></h2>
              <p class="section-copy" data-copy="systemCopy1"></p>
              <p class="section-copy" data-copy="systemCopy2"></p>
              <div class="tag-list"><span data-copy="tag1"></span><span data-copy="tag2"></span><span data-copy="tag3"></span><span data-copy="tag4"></span><span data-copy="tag5"></span><span data-copy="tag6"></span></div>
            </div>
            <div class="col-lg-6">
              <div class="surface">
                <div class="eyebrow mb-3" data-copy="flowEyebrow"></div>
                <div class="flow">
                  <div class="flow-item"><span>01</span><b data-copy="flow1"></b></div>
                  <div class="flow-item"><span>02</span><b data-copy="flow2"></b></div>
                  <div class="flow-item"><span>03</span><b data-copy="flow3"></b></div>
                  <div class="flow-item"><span>04</span><b data-copy="flow4"></b></div>
                  <div class="flow-item"><span>05</span><b data-copy="flow5"></b></div>
                  <div class="flow-item"><span>06</span><b data-copy="flow6"></b></div>
                </div>
                <p class="tiny-note mt-3 mb-0" data-copy="flowNote"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="performance">
        <div class="container">
          <div class="eyebrow" data-copy="calcEyebrow"></div>
          <h2 class="section-title"><span data-copy="calcTitle"></span> <span class="gold-text" data-copy="calcAccent"></span></h2>
          <p class="section-copy" data-copy="calcIntro"></p>
          <div class="metric-grid">
            <div class="metric-card"><strong>01</strong><span data-copy="metric1"></span><small data-copy="metric1Text"></small></div>
            <div class="metric-card"><strong>02</strong><span data-copy="metric2"></span><small data-copy="metric2Text"></small></div>
            <div class="metric-card"><strong>03</strong><span data-copy="metric3"></span><small data-copy="metric3Text"></small></div>
            <div class="metric-card"><strong>04</strong><span data-copy="metric4"></span><small data-copy="metric4Text"></small></div>
          </div>
          <div class="calculator row g-0">
            <div class="calculator-side col-lg-5">
              <div class="eyebrow mb-2" data-copy="modelEyebrow"></div>
              <h3 class="h3 mb-3" data-copy="modelTitle"></h3>
              <label class="form-label" for="balanceInput" data-copy="balanceLabel"></label>
              <div class="preset-row mb-3">
                <button class="preset" type="button" data-balance="200">€200</button><button class="preset" type="button" data-balance="500">€500</button>
                <button class="preset" type="button" data-balance="1000">€1k</button><button class="preset active" type="button" data-balance="5000">€5k</button>
                <button class="preset" type="button" data-balance="10000">€10k</button><button class="preset" type="button" data-balance="25000">€25k</button>
              </div>
              <input class="form-control" id="balanceInput" type="number" min="1" max="10000000" value="5000" />
              <div class="range-line"><label for="tradesInput" data-copy="tradesLabel"></label><output id="tradesOutput">2</output></div>
              <input class="form-range" id="tradesInput" type="range" min="1" max="5" step="1" value="2" />
              <div class="range-line"><label for="profitInput" data-copy="profitLabel"></label><output id="profitOutput">1.5%</output></div>
              <input class="form-range" id="profitInput" type="range" min="1" max="2.5" step=".1" value="1.5" />
              <div class="range-line"><label for="allocationInput" data-copy="allocationLabel"></label><output id="allocationOutput">20%</output></div>
              <input class="form-range" id="allocationInput" type="range" min="10" max="20" step="1" value="20" />
              <div class="mode-row"><button type="button" id="compoundMode" class="active" data-copy="compound"></button><button type="button" id="linearMode" data-copy="linear"></button></div>
              <p class="tiny-note mt-3 mb-0" data-copy="modelNote"></p>
            </div>
            <div class="calculator-side calculator-results col-lg-7">
              <div class="row g-2" id="periodCards">
                <div class="col-6"><div class="period-card"><span data-period="0"></span><strong id="value0"></strong><small id="change0"></small></div></div>
                <div class="col-6"><div class="period-card"><span data-period="1"></span><strong id="value1"></strong><small id="change1"></small></div></div>
                <div class="col-6"><div class="period-card"><span data-period="2"></span><strong id="value2"></strong><small id="change2"></small></div></div>
                <div class="col-6"><div class="period-card"><span data-period="3"></span><strong id="value3"></strong><small id="change3"></small></div></div>
              </div>
              <div class="disclosure mt-3" data-copy="calcDisclosure"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="section system-section" id="about">
        <div class="container">
          <div class="row g-4 align-items-center">
            <div class="col-lg-5"><div class="quote-box"><div class="eyebrow" data-copy="aboutEyebrow"></div><blockquote data-copy="quote"></blockquote><div class="tiny-note" data-copy="quoteBy"></div></div></div>
            <div class="col-lg-7"><h2 class="section-title mt-0" data-copy="aboutTitle"></h2><p class="section-copy" data-copy="aboutText1"></p><p class="section-copy" data-copy="aboutText2"></p></div>
          </div>
        </div>
      </section>

      <section class="section" id="advisors">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-5"><div class="eyebrow" data-copy="supportEyebrow"></div><h2 class="section-title" data-copy="supportTitle"></h2><p class="section-copy" data-copy="supportText"></p></div>
            <div class="col-lg-7"><div class="surface"><div class="row g-3">
              <div class="col-sm-6"><div class="info-card"><h3 data-copy="support1"></h3><p data-copy="support1Text"></p></div></div>

          const balance = Math.max(1, Number(balanceInput.value) || 1);
          const trades = Number(tradesInput.value), profit = Number(profitInput.value), allocation = Number(allocationInput.value);

          $("allocationOutput").textContent = `${allocation}%`;
          [1,22,66,264].forEach((days,index) => {
            const result = isCompound
              ? balance * Math.pow(1 + allocation / 100 * profit / 100, trades * days)
              : balance + balance * allocation / 100 * profit / 100 * trades * days;
            const change = (result / balance - 1) * 100;
            $(`value${index}`).textContent = money(result);

          if (!/^[+()\d\s.-]{5,20}$/.test(phone)) { $("formStatus").textContent = text[language].phoneError; return; }
          form.reset();
          $("formStatus").textContent = text[language].formSuccess;
        });
        setLanguage(language);
        updateCalculator();
